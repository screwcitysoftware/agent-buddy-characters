name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_releases: ${{ steps.plan.outputs.has_releases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Plan changed character releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_plan.py --base "${{ github.event.before }}"

  release:
    needs: plan
    if: needs.plan.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out pinned Agent Buddy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DanWahlin/agent-buddy
          ref: c87463a0f07c36ae9efec60ab9a5444d7b97a584
          path: agent-buddy
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install native renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Build and validate ${{ matrix.id }}
        run: |
          python scripts/build.py --character "${{ matrix.id }}"
          python tools/character_pack.py validate "dist/${{ matrix.id }}.acpk"
          cd agent-buddy
          bash tools/build_character_preview.sh
          cd ..
          python scripts/test_character_lab.py agent-buddy
      - name: Upload Character Lab screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: character-lab-${{ matrix.id }}-${{ github.sha }}
          path: test-results/character-lab/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Tag and publish ${{ matrix.id }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          CHARACTER: ${{ matrix.id }}
          VERSION: ${{ matrix.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "$CHARACTER v$VERSION"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/$CHARACTER.acpk" dist/SHA256SUMS dist/catalog.json dist/validation.json \
              --clobber
            gh release edit "$TAG" --title "$CHARACTER v$VERSION"
          else
            gh release create "$TAG" \
              "dist/$CHARACTER.acpk" dist/SHA256SUMS dist/catalog.json dist/validation.json \
              --verify-tag --generate-notes --title "$CHARACTER v$VERSION"
          fi

  pages:
    needs: [plan, release]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build and test gallery
        run: |
          python scripts/build.py
          python scripts/build_site.py
          git diff --exit-code -- characters
          python -m unittest discover -s tests -v
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy-pages:
    needs: pages
    if: always() && needs.pages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
