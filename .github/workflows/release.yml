name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example, 1.0.0)
        required: true
        type: string
      desktop_visual_approved:
        description: I reviewed the Character Lab screenshots for this commit
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  character-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require main and visual approval
        env:
          APPROVED: ${{ inputs.desktop_visual_approved }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$APPROVED" = "true"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned Agent Buddy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DanWahlin/agent-buddy
          ref: c87463a0f07c36ae9efec60ab9a5444d7b97a584
          path: agent-buddy
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install native renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Build and render every character state
        run: |
          python scripts/build.py
          cd agent-buddy
          bash tools/build_character_preview.sh
          cd ..
          python scripts/test_character_lab.py agent-buddy
      - name: Upload approved screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-character-lab-${{ github.sha }}
          path: test-results/character-lab/*.png
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: character-lab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semantic and must not include a v prefix." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi
      - name: Build, test, and generate gallery
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/build.py --release-version "$VERSION"
          python scripts/build_site.py
          git diff --exit-code -- characters
          python -m unittest discover -s tests -v
          for pack in dist/*.acpk; do python tools/character_pack.py validate "$pack"; done
      - name: Tag release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v$VERSION"
          dist/*.acpk dist/SHA256SUMS dist/catalog.json dist/validation.json
          --verify-tag --generate-notes --title "v$VERSION"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

